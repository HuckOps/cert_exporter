name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '模拟 Tag 版本'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  PROJECT_NAME: cert_exporter
  GCR_REGISTRY: gcr.io
  GCR_PROJECT_ID: ${{ secrets.GCR_PROJECT_ID }}
  
jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 'stable'

      - name: Run Tests
        run: go test ./...

      - name: Build and Package via Makefile (with dynamic version)
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            DYNAMIC_VERSION="${GITHUB_REF_NAME#v}"
          else
            DYNAMIC_VERSION="0.1.0"
          fi
          
          echo "Building version: ${DYNAMIC_VERSION}"
          echo "Git Revision: $(git rev-parse --short HEAD)"
          
          make package VERSION=${DYNAMIC_VERSION}
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: List Package Artifacts
        run: ls -la ./package/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: ./package/*.tar.gz
          generate_release_notes: true

  build-docker:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCR_REGISTRY }}
          username: _json_key
          password: ${{ secrets.GCR_SERVICE_ACCOUNT_KEY }}

      - name: Extract version
        id: extract-version
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            DYNAMIC_VERSION="${GITHUB_REF_NAME#v}"
          else
            DYNAMIC_VERSION="0.1.0"
          fi
          echo "VERSION=${DYNAMIC_VERSION}" >> $GITHUB_OUTPUT
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image to GCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.GCR_REGISTRY }}/${{ env.GCR_PROJECT_ID }}/${{ env.PROJECT_NAME }}:${{ steps.extract-version.outputs.VERSION }}
            ${{ env.GCR_REGISTRY }}/${{ env.GCR_PROJECT_ID }}/${{ env.PROJECT_NAME }}:${{ steps.extract-version.outputs.GIT_SHA }}
            ${{ env.GCR_REGISTRY }}/${{ env.GCR_PROJECT_ID }}/${{ env.PROJECT_NAME }}:latest
